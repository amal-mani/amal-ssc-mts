<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Quick question</title>
<style>
  :root{--bg:#171b23;--card:#202634;--ink:#eef1f6;--muted:#9aa3b2;--acc:#ff7a59;--ok:#59d499;--bad:#ff6b6b;--tr:#ffc65c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
  body{display:flex;flex-direction:column;border:1px solid #2e3646;border-radius:12px;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#11151c;-webkit-app-region:drag}
  header b{flex:1;font-size:14px;color:var(--muted)}
  header button{-webkit-app-region:no-drag}
  main{flex:1;overflow:auto;padding:12px 14px 16px}
  .q{font-size:18px;font-weight:700;margin:4px 0 10px}
  .opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:2px solid transparent;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  .opt .b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-content:center;background:#11151c;font-weight:700;font-size:13px}
  .opt:hover:not(:disabled){border-color:#3a4458}
  .opt.right{border-color:var(--ok);background:#59d49922}.opt.wrong{border-color:var(--bad);background:#ff6b6b22}
  .opt:disabled{cursor:default}
  .card{border-left:4px solid;border-radius:10px;padding:8px 12px;margin:10px 0}
  .card h4{margin:0 0 4px;font-size:14px}.card p{margin:4px 0}
  .why{border-color:var(--bad);background:#ff6b6b14}.why h4{color:var(--bad)}
  .steps{border-color:var(--ok);background:#59d49912}.steps h4{color:var(--ok)}
  .trick{border-color:var(--tr);background:#ffc65c14}.trick h4{color:var(--tr)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:#1a0d08}
  .ghost{background:#232a36;color:var(--ink);font-weight:600}
  .x{background:transparent;color:var(--muted);border:0;font-size:18px;cursor:pointer;padding:2px 8px}
  .verdict{font-weight:700;font-size:17px;margin:10px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><b id="sub">Quick question</b><button class="x" id="say" title="Read aloud">🔊</button><button class="x" id="x" title="Close">✕</button></header>
<main id="m"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUB={Quant:'Maths',Reasoning:'Reasoning',English:'English',GA:'GK',CA:'Current affairs'};
let q=null,done=false;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function chime(){try{if(qq.sound&&!qq.sound())return;const A=new (window.AudioContext||window.webkitAudioContext)(),t=A.currentTime;[[880,0],[1175,.18],[1568,.36]].forEach(([f,d])=>{const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.45);o.connect(g);g.connect(A.destination);o.start(t+d);o.stop(t+d+.5)});setTimeout(()=>A.close(),1500)}catch(e){}}
function steps(e){return String(e||'').split(/(?<=[.!?])\s+(?=[A-Z0-9₹(√"'])/).filter(Boolean)}
function draw(){done=false;const m=$('m');
  if(!q){m.innerHTML='<p>No questions yet. Open MTS Study once so it can load your questions.</p><div class="row"><button class="btn" id="c">Close</button></div>';$('c').onclick=()=>qq.close();return}
  $('sub').textContent='Quick question · '+(SUB[q.s]||q.s);
  m.innerHTML=`<p class="q">${esc(q.q)}</p>${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="b">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}<div id="after"></div><div class="row" id="later"><button class="btn ghost" id="nn">Not now</button></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));$('nn').onclick=()=>qq.close();m.scrollTop=0}
function pick(i){if(done)return;done=true;qq.answer(i);const ok=i===q.a;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  $('later').remove();const w=Array.isArray(q.w)&&q.w[i]?q.w[i]:(q.s==='Quant'?'Your answer does not match the working. Follow the steps below.':'Read the right answer and the steps. This question comes back in your revision.');
  const S=steps(q.e);
  $('after').innerHTML=`<p class="verdict" style="color:${ok?'var(--ok)':'var(--ok)'}">${ok?'Correct! Well done.':'Answer: '+'ABCD'[q.a]+'. '+esc(q.o[q.a])}</p>
   ${ok?'':`<div class="card why"><h4>Why it went wrong</h4><p>You chose <b>${esc(q.o[i])}</b>. ${esc(w)}</p></div>`}
   ${S.length?`<div class="card steps"><h4>${ok?'How to solve it':'The right answer, step by step'}</h4>${S.map((x,k)=>`<p>${S.length>1?(k+1)+'. ':''}${esc(x)}</p>`).join('')}</div>`:''}
   ${q.tr?`<div class="card trick"><h4>Remember</h4><p>${esc(q.tr)}</p></div>`:''}
   ${q.ml?`<button class="btn ghost" id="mlb">മലയാളം വിശദീകരണം</button><p id="mlt" lang="ml" hidden>${esc(q.ml)}</p>`:''}
   <div class="row"><button class="btn ghost" id="ra">🔊 Read the answer</button><button class="btn" id="more">One more question</button><button class="btn ghost" id="cl">Close</button></div>`;
  if($('mlb'))$('mlb').onclick=()=>{$('mlt').hidden=!$('mlt').hidden};
  $('ra').onclick=()=>speak('The answer is '+q.o[q.a]+'. '+q.e);$('more').onclick=()=>qq.more();$('cl').onclick=()=>qq.close()}
$('x').onclick=()=>qq.close();
$('say').onclick=()=>{if(q)speak(q.q+'. '+q.o.map((o,i)=>'Option '+'ABCD'[i]+': '+o).join('. '))};
document.addEventListener('keydown',e=>{if(!done&&/^[a-dA-D1-4]$/.test(e.key)){const k=isNaN(+e.key)?'abcd'.indexOf(e.key.toLowerCase()):+e.key-1;pick(k)}else if(e.key==='Escape')qq.close()});
qq.onQuestion(n=>{q=n;draw();chime()});
q=qq.get();draw();chime();
</script>
</body>
</html>
