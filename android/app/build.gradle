plugins { id 'com.android.application' }
android {
    namespace 'com.amalmani.mtsstudy'
    compileSdk 34
    defaultConfig {
        applicationId 'com.amalmani.mtsstudy'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        app {
            // Fixed key so each new version installs over the old one.
            storeFile file('mts-study.p12')
            storeType 'pkcs12'
            storePassword 'mtsstudy'
            keyAlias 'mts'
            keyPassword 'mtsstudy'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.app }
        debug { signingConfig signingConfigs.app }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
