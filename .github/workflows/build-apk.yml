name: Build phone app (APK)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MTS-Study.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MTS Study app v1.${{ github.run_number }}
          make_latest: 'true'
          files: MTS-Study.apk
          body: |
            Download **MTS-Study.apk** below, tap it on your phone, then tap Install.
            If Android asks, allow "Install unknown apps" for your browser or file app.
